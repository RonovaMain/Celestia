name: Build signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже есть на образе ubuntu-24.04 (ANDROID_HOME); только принимаем лицензии.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1. ONNX-шаблоны генератора RVC v2 (граф без весов). Всё тянется из pip и GitHub.
      - name: Export ONNX templates
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy==1.13.1 onnx==1.16.2 onnxruntime==1.19.2
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI rvc
          echo "--- файлы с onnx/infer_pack в клоне:"; find rvc -iname "*models_onnx*" -o -type d -name infer_pack | head
          # запасной вариант, если в клоне раскладка изменилась: те же исходники из зеркала на Hugging Face
          if [ -z "$(find rvc -name models_onnx.py)" ]; then
            mkdir -p rvc/lib/infer_pack
            for f in attentions commons models_onnx modules transforms; do
              curl -fL --retry 5 -o rvc/lib/infer_pack/$f.py \
                "https://huggingface.co/nevreal/easygui/resolve/main/Retrieval-based-Voice-Conversion-WebUI/lib/infer_pack/$f.py"
            done
          fi
          python tools/export_templates.py rvc app/src/main/assets/templates
          ls -la app/src/main/assets/templates

      # 1b. Вшиваемые модели: ContentVec, RMVPE, FCPE (ONNX). Кэш, чтобы не качать ~600 МБ каждый раз.
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: celestia-models-v2

      - name: Download voice models
        run: |
          mkdir -p app/src/main/assets/models
          cd app/src/main/assets/models
          dl() { [ -s "$2" ] || curl -fL --retry 5 --retry-delay 5 -o "$2" "$1"; }
          dl https://huggingface.co/NaruseMioShirakana/MoeSS-SUBModel/resolve/main/vec-768-layer-12.onnx hubert.onnx
          echo "b3886e7dff1495cda514f94f4680a7b1261e05d6929f5c764cdb17934b413c2a  hubert.onnx" | sha256sum -c -
          dl https://huggingface.co/Scicom-intl/rmvpe-onnx/resolve/main/rmvpe.onnx rmvpe.onnx
          dl https://huggingface.co/Scicom-intl/fcpe-onnx/resolve/main/fcpe.onnx fcpe.onnx
          # Разделение вокала (MDX-Net из UVR). Скачиваем с запасным зеркалом; если не вышло — только предупреждение:
          # приложение покажет «модель не установлена» и даст выбрать свой .onnx.
          dl_try() {
            out="$1"; shift
            [ -s "$out" ] && return 0
            for u in "$@"; do
              if curl -fL --retry 3 --retry-delay 5 -o "$out.part" "$u"; then mv "$out.part" "$out"; return 0; fi
            done
            rm -f "$out.part"; echo "::warning::Не удалось скачать $out"; return 0
          }
          dl_try mdx_voc_ft.onnx \
            https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Voc_FT.onnx \
            https://huggingface.co/seanghay/uvr_models/resolve/main/UVR-MDX-NET-Voc_FT.onnx
          dl_try mdx_kim_vocal2.onnx \
            https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/Kim_Vocal_2.onnx \
            https://huggingface.co/seanghay/uvr_models/resolve/main/Kim_Vocal_2.onnx
          ls -la
          cd -
          python tools/check_models.py app/src/main/assets/models

      # 1c. Встроенный TTS: sherpa-onnx (Kokoro-82M int8 и Piper ru). Нативные библиотеки, Kotlin-API и модели —
      # из одного релиза. Свой libonnxruntime.so sherpa переименовывается, чтобы не конфликтовать с ORT приложения.
      - name: Cache TTS models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/tts
          key: celestia-tts-v1

      - name: Fetch sherpa-onnx runtime and TTS models
        env:
          SHERPA: v1.13.8
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf bzip2
          WS="$GITHUB_WORKSPACE"
          mkdir -p /tmp/sh && cd /tmp/sh
          curl -fL --retry 5 --retry-delay 5 -o android.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/$SHERPA/sherpa-onnx-$SHERPA-android.tar.bz2"
          tar xf android.tar.bz2
          J=$(find /tmp/sh -type d -path '*jniLibs/arm64-v8a' | head -1)
          [ -n "$J" ] || { echo "::error::В архиве sherpa-onnx нет jniLibs/arm64-v8a"; find /tmp/sh -maxdepth 3 | head -30; exit 1; }
          D="$WS/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$D" && cp "$J"/*.so "$D"/
          cd "$D"
          if [ -f libonnxruntime.so ]; then
            mv libonnxruntime.so libonnxruntime_sherpa.so
            patchelf --set-soname libonnxruntime_sherpa.so libonnxruntime_sherpa.so
            for f in lib*.so; do
              [ "$f" = libonnxruntime_sherpa.so ] && continue
              if patchelf --print-needed "$f" | grep -qx libonnxruntime.so; then
                patchelf --replace-needed libonnxruntime.so libonnxruntime_sherpa.so "$f"
              fi
            done
          fi
          for f in lib*.so; do echo "== $f"; patchelf --print-needed "$f" | grep -i onnx || true; done
          cd "$WS"
          # Kotlin-обёртки sherpa-onnx ТОГО ЖЕ релиза (JNI привязан к именам классов)
          git clone --depth 1 --branch "$SHERPA" https://github.com/k2-fsa/sherpa-onnx.git /tmp/sherpa-src
          K=/tmp/sherpa-src/sherpa-onnx/kotlin-api
          [ -f "$K/Tts.kt" ] || { echo "::error::Нет kotlin-api/Tts.kt в $SHERPA"; ls /tmp/sherpa-src/sherpa-onnx | head -40; exit 1; }
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          cp "$K"/*.kt app/src/main/java/com/k2fsa/sherpa/onnx/
          ls app/src/main/java/com/k2fsa/sherpa/onnx | head -40

          # Голоса: в assets кладём только нужное (модель, токены, голоса, лексиконы, espeak-ng-data)
          T="$WS/app/src/main/assets/tts"; mkdir -p "$T"
          base=https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models
          get() {  # $1 = папка в assets, $2 = архив без .tar.bz2, $3 = nodata, если espeak-ng-data не нужна
            [ -s "$T/$1/model.onnx" ] && return 0
            rm -rf "/tmp/tts-$1"; mkdir -p "/tmp/tts-$1"
            curl -fL --retry 5 --retry-delay 5 -o "/tmp/tts-$1.tar.bz2" "$base/$2.tar.bz2" || { echo "::warning::Не скачался TTS-пакет $2"; return 0; }
            tar xf "/tmp/tts-$1.tar.bz2" -C "/tmp/tts-$1"
            src=$(find "/tmp/tts-$1" -mindepth 1 -maxdepth 1 -type d | head -1)
            m=$(ls "$src"/model*.onnx "$src"/*.onnx 2>/dev/null | head -1)
            [ -n "$m" ] || { echo "::warning::В пакете $2 нет .onnx"; return 0; }
            mkdir -p "$T/$1"
            cp "$m" "$T/$1/model.onnx"
            cp "$src/tokens.txt" "$T/$1/"
            for f in voices.bin lexicon-us-en.txt lexicon-gb-en.txt; do [ -f "$src/$f" ] && cp "$src/$f" "$T/$1/" || true; done
            if [ "$3" != nodata ]; then cp -r "$src/espeak-ng-data" "$T/$1/"; fi
            rm -rf "/tmp/tts-$1" "/tmp/tts-$1.tar.bz2"
          }
          get kokoro kokoro-int8-multi-lang-v1_0
          get piper-ru-irina vits-piper-ru_RU-irina-medium
          get piper-ru-denis vits-piper-ru_RU-denis-medium nodata
          du -sh "$T"/* || true

      # 2. Ключ подписи: постоянный из секретов GitHub; если секретов нет — обычный debug-ключ.
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}" >> "$GITHUB_ENV"
          else
            echo "::warning::Секреты подписи не заданы: APK будет подписан debug-ключом."
          fi

      # 3. Сборка: Gradle, ONNX Runtime, Compose и остальное скачиваются сами.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Celestia-signed-apk
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0
